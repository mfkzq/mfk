    <script>
    // 将内联库包装成与 npm qrcode 兼容的 QRCode.toDataURL API，保持原调用代码不变
    (function(){
        // 将全局工厂函数 qrcode 捕获到本地，避免与 window.QRCode 命名混淆
        var QRFactory = window.qrcode;
        qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"]; // 默认UTF-8，支持中文
        window.QRCode = {
            toDataURL: function(text, opts, cb){
                if (typeof opts === "function") { cb = opts; opts = {}; }
                opts = opts || {};
                var ecLevel = (opts.errorCorrectionLevel || "M").toString().toUpperCase();
                if (ecLevel !== "L" && ecLevel !== "M" && ecLevel !== "Q" && ecLevel !== "H") ecLevel = "M";
                var targetW = opts.width || 256;
                var margin = (opts.margin != null) ? opts.margin : 2;
                try {
                    // QRFactory(typeNumber, ecLevel)：typeNumber=0 自动选择，ecLevel 必须传字符串 L/M/Q/H
                    var qr = QRFactory(0, ecLevel);
                    qr.addData(String(text), "Byte");
                    qr.make();
                    var count = qr.getModuleCount();
                    // cellSize：让总宽度(含两边margin)尽量接近targetW
                    var cellSize = Math.max(2, Math.floor((targetW - 2*margin) / count) || 4);
                    var fullW = count * cellSize + margin * 2;
                    var canvas = document.createElement('canvas');
                    canvas.width = fullW;
                    canvas.height = fullW;
                    var ctx = canvas.getContext('2d');
                    // 背景白
                    var light = (opts.color && opts.color.light) || '#ffffff';
                    var dark = (opts.color && opts.color.dark) || '#000000';
                    ctx.fillStyle = light;
                    ctx.fillRect(0, 0, fullW, fullW);
                    ctx.fillStyle = dark;
                    for (var r = 0; r < count; r++) {
                        for (var cc = 0; cc < count; cc++) {
                            if (qr.isDark(r, cc)) {
                                ctx.fillRect(margin + cc * cellSize, margin + r * cellSize, cellSize, cellSize);
                            }
                        }
                    }
                    var dataUrl = canvas.toDataURL('image/png');
                    if (cb) cb(null, dataUrl);
                    return dataUrl;
                } catch(e){
                    console.error('QRCode generate error:', e);
                    if (cb) return cb(e);
                    throw e;
                }
            }
        };
    })();

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" onerror="this.onerror=null;this.src='https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js'"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4edf5 100%);
            min-height: 100vh;
            margin: 0;
            padding-bottom: 140px;
        }
        .page { display: none; }
        .page.active { display: block; }

        /* 悬浮控制条 - 垂直两行常驻 */
        .float-bar {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1000;
            display: none;
            flex-direction: column;
            gap: 10px;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px 14px;
            box-shadow: 0 6px 30px rgba(0,0,0,0.15);
            min-width: 320px;
        }
        .float-bar.show { display: flex; }
        .float-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .float-row + .float-row {
            border-top: 1px solid #e2e8f0;
            padding-top: 10px;
        }
        .float-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: white;
            flex-shrink: 0;
            transition: all 0.3s;
        }
        .float-btn:hover { transform: scale(1.08); }
        .float-btn.active { box-shadow: 0 0 0 3px rgba(255,255,255,0.6), 0 0 0 6px currentColor; }
        .btn-scroll { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); box-shadow: 0 2px 12px rgba(102,126,234,0.4); }
        .btn-play { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); box-shadow: 0 2px 12px rgba(17,153,142,0.4); }
        .speed-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex: 1;
            min-width: 220px;
        }
        .speed-label { font-size: 12px; color: #64748b; white-space: nowrap; font-weight: 600; }
        .speed-val { font-size: 12px; font-weight: 700; min-width: 56px; text-align: right; }
        .speed-group input[type="range"] { flex: 1; width: 100%; }

        /* 滑块美化 */
        input[type="range"] {
            -webkit-appearance: none;
            height: 5px;
            border-radius: 3px;
            background: #e2e8f0;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
        }
        input[type="number"] {
            width: 70px;
            padding: 4px 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
        }
        select {
            padding: 6px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13px;
            background: white;
        }

        /* 条码项 */
        .barcode-item {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s;
        }
        .barcode-item.highlight {
            border: 3px solid #667eea;
            transform: scale(1.02);
            box-shadow: 0 4px 24px rgba(102, 126, 234, 0.3);
        }
        .barcode-item svg, .barcode-item canvas, .barcode-item img { max-width: 100%; }

        /* 条码内容+序号同行显示 */
        .barcode-meta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .barcode-text {
            font-family: 'SF Mono', Menlo, Consolas, monospace;
            color: #374151;
            font-weight: 600;
            word-break: break-all;
        }
        .barcode-index {
            background: #667eea;
            color: white;
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .btn-primary {

        .btn-secondary {
            background: white; color: #667eea; border: 2px solid #667eea;

        .btn-secondary:hover { background: #667eea; color: white; }
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white; border: none; padding: 10px 22px; border-radius: 10px;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.3s;
            box-shadow: 0 2px 12px rgba(17,153,142,0.3);

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);

            box-shadow: 0 2px 12px rgba(235,51,73,0.3);

        .btn-warm {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);

        textarea {

            font-family: 'SF Mono', Menlo, Consolas, monospace;

        .card {
            background: white; border-radius: 16px; padding: 24px;

        .back-btn {

            font-weight: 600; cursor: pointer; margin-bottom: 20px; padding: 8px 16px;
            border-radius: 8px; transition: background 0.3s;
        }
        .back-btn:hover { background: rgba(102, 126, 234, 0.1); }

        /* 幻灯覆盖层 */
        .slideshow-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9); z-index: 2000; display: none;
            align-items: center; justify-content: center; flex-direction: column;
        }
        .slideshow-overlay.active { display: flex; }
        .slideshow-item {
            background: white; padding: 40px; border-radius: 20px; max-width: 90vw; max-height: 80vh;
            display: flex; flex-direction: column; align-items: center; overflow: auto;
        }
        .slideshow-close {
            position: absolute; top: 24px; right: 24px; width: 48px; height: 48px;

        }
        .slideshow-counter { color: white; margin-top: 20px; font-size: 18px; }

        /* Toast */
        .toast {
            position: fixed; top: 24px; left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #333; color: white; padding: 12px 24px;
            border-radius: 10px; z-index: 3000; transition: transform 0.3s;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* 复选框标签 */
        .chk-label {
            display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
            font-size: 14px; color: #374151; user-select: none;
        }
        .chk-label input[type="checkbox"] {
            width: 16px; height: 16px; cursor: pointer; accent-color: #667eea;
        }

        /* ========== 打印设置弹窗 ========== */
        .modal-mask {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2500;
            display: none; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-mask.active { display: flex; }
        .modal-box {
            background: white; border-radius: 16px; width: 100%; max-width: 720px;
            max-height: 90vh; overflow-y: auto; padding: 28px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .modal-title {
            font-size: 20px; font-weight: 700; margin-bottom: 20px;
            display: flex; justify-content: space-between; align-items: center;

        }
        .modal-close {

            background: #f1f5f9; cursor: pointer; font-size: 18px; color: #64748b;
        }
        .modal-close:hover { background: #e2e8f0; }
        .setting-group { margin-bottom: 20px; }
        .setting-group-title {
            font-size: 14px; font-weight: 700; color: #475569;
            margin-bottom: 10px; padding-bottom: 6px;
            border-bottom: 2px solid #e2e8f0;
        }
        .setting-row {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
            gap: 12px; margin-bottom: 10px;
        }
        .setting-field { display: flex; flex-direction: column; gap: 4px; }
        .setting-field label { font-size: 12px; color: #64748b; font-weight: 600; }
        .setting-field input, .setting-field select {
            padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 8px;
            font-size: 14px; width: 100%;
        }
        .setting-field input:focus, .setting-field select:focus {
            outline: none; border-color: #667eea;
        }
        .radio-row { display: flex; gap: 16px; flex-wrap: wrap; }
        .radio-row label {
            display: inline-flex; align-items: center; gap: 6px;
            cursor: pointer; font-size: 14px;
        }
        .modal-footer {
            display: flex; justify-content: flex-end; gap: 10px;
            margin-top: 24px; padding-top: 16px; border-top: 1px solid #e2e8f0;
        }

        /* ========== 打印专用样式 ========== */
        @media print {
            body * { visibility: hidden !important; }
            #print-area, #print-area * { visibility: visible !important; }
            #print-area {
                position: absolute; left: 0; top: 0; width: 100%;
                background: white; padding: 0; margin: 0;
            }
            .print-page { page-break-after: always; }
            .print-page:last-child { page-break-after: auto; }
            @page { margin: 0; }
        }
        .print-page {
            background: white; box-sizing: border-box;
            display: flex; flex-direction: column;
        }
        .print-grid {
            flex: 1; display: grid;
        }
        .print-cell {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            overflow: hidden; page-break-inside: avoid;
        }
        .print-cell svg, .print-cell canvas, .print-cell img { max-width: 100%; max-height: 100%; }
        .print-page-num {
            text-align: center; font-size: 10pt; color: #666;
        }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>

    <!-- ========== 首页 ========== -->
    <div id="home-page" class="page active">

            <div class="card">
                <div class="mb-5">
                    <label class="block text-gray-700 font-semibold mb-2">
                        字体大小: <span id="barcode-font-size-value" class="text-[#667eea]">20</span> px
                    </label>
                    <input type="range" id="barcode-font-size" min="10" max="50" value="20" oninput="document.getElementById('barcode-font-size-value').textContent=this.value">
                </div>
                <div class="mb-5">
                    <label class="block text-gray-700 font-semibold mb-2">
                        条码高度: <span id="barcode-height-value" class="text-[#667eea]">100</span> px
                    </label>
                    <input type="range" id="barcode-height" min="40" max="200" value="100" oninput="document.getElementById('barcode-height-value').textContent=this.value">
                </div>

                    <label class="chk-label">
                        <input type="checkbox" id="barcode-show-index" checked>

                </div>
                <div class="mb-5">
                    <label class="block text-gray-700 font-semibold mb-2">条码内容（每行一条数据）</label>
                    <textarea id="barcode-input" placeholder="请输入或粘贴条码内容，每行一条...&#10;例如：&#10;1234567890&#10;ABCDEFGHIJ&#10;9876543210"></textarea>
                </div>
                <div class="flex flex-wrap gap-3">
                    <button class="btn-primary" onclick="generateBarcodes()">🔨 生成条码</button>
                    <button class="btn-secondary" onclick="document.getElementById('barcode-excel').click()">📁 从Excel导入</button>
                    <input type="file" id="barcode-excel" accept=".xlsx,.xls,.csv" style="display:none" onchange="importExcel('barcode', event)">
                    <button class="btn-success" onclick="downloadAll('barcode')">💾 下载全部</button>
                    <button class="btn-warm" onclick="openPrintModal()">🖨️ 打印导出</button>

    <!-- ========== 二维码页 ========== -->

        <div class="max-w-3xl mx-auto px-6 py-8">
            <div class="back-btn" onclick="showPage('home-page')">← 返回首页</div>

            <div class="card">
                <div class="mb-5">
                    <label class="block text-gray-700 font-semibold mb-2">

                <div class="mb-5">

                <div class="mb-5">
                    <label class="block text-gray-700 font-semibold mb-2">二维码内容（每行一条数据）</label>

                </div>
                <div class="flex flex-wrap gap-3">
                    <button class="btn-success" onclick="generateQrcodes()">🔨 生成二维码</button>

                    <input type="file" id="qrcode-excel" accept=".xlsx,.xls,.csv" style="display:none" onchange="importExcel('qrcode', event)">
                    <button class="btn-primary" onclick="downloadAll('qrcode')">💾 下载全部</button>
                    <button class="btn-warm" onclick="openPrintModal()">🖨️ 打印导出</button>
                    <button class="btn-danger" onclick="clearAll('qrcode')">🗑️ 清空</button>
                </div>

            <div id="qrcode-display-area">

    <!-- ========== 悬浮控制条（垂直两行常驻） ========== -->
    <div class="float-bar" id="float-bar">
        <div class="float-row">
            <button class="float-btn btn-scroll" id="scroll-btn" onclick="toggleScroll()" title="自动滚动 (空格启停)">⇅</button>
            <div class="speed-group">
                <span class="speed-label">滚动速度</span>

        </div>
        <div class="float-row">
            <button class="float-btn btn-play" id="play-btn" onclick="toggleSlideshow()" title="幻灯播放">▶</button>
            <div class="speed-group">
                <span class="speed-label">播放间隔</span>
                <!-- 0~100 对数映射：200ms~20s，最慢20秒/张，最快0.2秒/张 -->
                <input type="range" id="play-speed" min="0" max="100" value="50" step="1">
                <span class="speed-val" id="play-speed-val" style="color:#11998e;min-width:52px;text-align:right;">2.0s</span>
            </div>
        </div>

    <!-- ========== 幻灯覆盖层 ========== -->
    <div class="slideshow-overlay" id="slideshow-overlay">
        <button class="slideshow-close" onclick="stopSlideshow()">✕</button>
        <div class="slideshow-item" id="slideshow-item"></div>
        <div class="slideshow-counter" id="slideshow-counter">1 / 10</div>

    <!-- ========== 打印设置弹窗 ========== -->
    <div class="modal-mask" id="print-modal">
        <div class="modal-box">
            <div class="modal-title">
                <span>🖨️ 打印设置</span>

    <!-- 打印渲染区域（动态插入） -->
    <div id="print-area" style="display:none"></div>

    <script>
        /* ====== 全局状态 ====== */
        let currentType = 'barcode';
        let isScrolling = false;
        let scrollAnimationId = null;
        let scrollY = 0;
        let isPlaying = false;
        let playIntervalId = null;
        let currentSlideIndex = 0;
        let generatedItems = [];

        const PAPER_SIZES = {
            A4: [210, 297], A5: [148, 210], A3: [297, 420],
            B5: [176, 250], Letter: [216, 279]
        };

        /* ====== 页面切换 ====== */
        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            stopScroll(); stopSlideshow();
            const bar = document.getElementById('float-bar');
            if (pageId === 'home-page') {
                bar.classList.remove('show');
            } else {
                bar.classList.add('show');
                currentType = pageId === 'barcode-page' ? 'barcode' : 'qrcode';
            }
            window.scrollTo(0, 0);
        }

        /* ====== Toast ====== */
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        /* ====== 速度滑块实时显示 ====== */
        document.getElementById('scroll-speed').addEventListener('input', function() {
            // 数值显示近似速度（px/s）：档位1~100 → 60px/s ~ 1500px/s
            const v = parseInt(this.value);
            const pxps = Math.round(60 + (v - 1) * 14.55); // 线性: v=1→60, v=100→60+99*14.55≈1500
            document.getElementById('scroll-speed-val').textContent = pxps < 1000 ? pxps + 'px/s' : (pxps/1000).toFixed(1) + 'k/s';
        });
        // 播放间隔：0~100 对数映射 → 20000ms(慢,左) ~ 200ms(快,右)，左慢右快（符合习惯）
        // v=0 → 20000ms(20s/张 最慢); v=50 → 2000ms(2s/张 默认); v=100 → 200ms(约5张/秒 最快)
        function getPlayInterval() {
            const v = parseInt(document.getElementById('play-speed').value);
            return Math.max(200, Math.round(20000 * Math.pow(0.01, v / 100)));
        }
        function formatInterval(ms) {
            if (ms < 1000) return ms + 'ms';
            return (ms/1000).toFixed(1) + 's';
        }
        document.getElementById('play-speed').addEventListener('input', function() {
            const ms = getPlayInterval();
            document.getElementById('play-speed-val').textContent = formatInterval(ms);
            if (isPlaying) {
                clearInterval(playIntervalId);
                playIntervalId = setInterval(() => {
                    currentSlideIndex = (currentSlideIndex + 1) % generatedItems.length;
                    showSlide(currentSlideIndex);
                }, ms);
            }
        });
        // 初始化显示
        (function initSpeedDisplay(){
            const sv = document.getElementById('scroll-speed').value;
            const pxps = Math.round(60 + (sv - 1) * 14.55);
            document.getElementById('scroll-speed-val').textContent = pxps<1000?pxps+'px/s':(pxps/1000).toFixed(1)+'k/s';
            document.getElementById('play-speed-val').textContent = formatInterval(getPlayInterval());
        })();

        /* ====== Excel 导入 ====== */
        function importExcel(type, event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const wb = XLSX.read(data, { type: 'array' });
                    const ws = wb.Sheets[wb.SheetNames[0]];
                    const json = XLSX.utils.sheet_to_json(ws, { header: 1 });
                    const lines = json
                        .map(r => r[0])
                        .filter(v => v !== undefined && v !== null && String(v).trim() !== '')
                        .map(v => String(v).trim());
                    document.getElementById(type + '-input').value = lines.join('\n');
                    showToast(`成功导入 ${lines.length} 条数据`);
                } catch (err) {
                    showToast('导入失败，请检查文件格式');
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(file);
            event.target.value = '';
        }

        /* ====== 生成条形码 ====== */
        function generateBarcodes() {
            const input = document.getElementById('barcode-input').value.trim();
            if (!input) { showToast('请先输入条码内容'); return; }
            const lines = input.split('\n').map(l => l.trim()).filter(l => l);
            if (!lines.length) { showToast('没有有效数据'); return; }

            const fontSize = parseInt(document.getElementById('barcode-font-size').value);
            const height = parseInt(document.getElementById('barcode-height').value);
            const showIndex = document.getElementById('barcode-show-index').checked;
            const listDiv = document.getElementById('barcode-list');
            listDiv.innerHTML = '';
            generatedItems = [];

            lines.forEach((text, index) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'barcode-item';
                itemDiv.id = 'barcode-item-' + index;

                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.id = 'barcode-svg-' + index;
                itemDiv.appendChild(svg);

                // 元信息行：序号+内容 同行
                const meta = document.createElement('div');
                meta.className = 'barcode-meta';
                if (showIndex) {
                    const idx = document.createElement('span');
                    idx.className = 'barcode-index';
                    idx.textContent = '#' + (index + 1);
                    meta.appendChild(idx);
                }
                const txt = document.createElement('span');
                txt.className = 'barcode-text';
                txt.textContent = text;
                meta.appendChild(txt);
                itemDiv.appendChild(meta);

                listDiv.appendChild(itemDiv);

                try {
                    JsBarcode(svg, text, {
                        format: "CODE128", width: 2, height: height,
                        displayValue: false, fontSize: fontSize, margin: 10, font: 'monospace'
                    });
                    generatedItems.push({ id: index, text: text, element: itemDiv });
                } catch (err) {
                    itemDiv.innerHTML = `<div class="text-red-500 py-8">❌ 无法生成: ${text} (${err.message})</div>`;
                }
            });
            showToast(`成功生成 ${generatedItems.length} 个条形码`);
        }

        /* ====== 生成二维码 ====== */
        function generateQrcodes() {
            if (typeof QRCode === 'undefined') {
                showToast('二维码库未加载，请刷新页面重试');
                return;
            }
            const input = document.getElementById('qrcode-input').value.trim();
            if (!input) { showToast('请先输入二维码内容'); return; }
            const lines = input.split('\n').map(l => l.trim()).filter(l => l);
            if (!lines.length) { showToast('没有有效数据'); return; }

            const size = parseInt(document.getElementById('qrcode-size').value);
            const ecLevel = document.querySelector('input[name="ec-level"]:checked').value;
            const showIndex = document.getElementById('qrcode-show-index').checked;
            const listDiv = document.getElementById('qrcode-list');
            listDiv.innerHTML = '';
            generatedItems = [];

            // 逐张生成（toDataURL方式，比canvas更稳定）
            (async () => {
                let successCount = 0;
                for (let index = 0; index < lines.length; index++) {
                    const text = lines[index];
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'barcode-item';
                    itemDiv.id = 'qrcode-item-' + index;
                    itemDiv.style.maxWidth = (size + 80) + 'px';

                    const img = document.createElement('img');
                    img.id = 'qrcode-img-' + index;
                    img.alt = text;
                    img.style.width = size + 'px';
                    img.style.height = size + 'px';
                    img.style.imageRendering = 'pixelated';
                    itemDiv.appendChild(img);

                    const meta = document.createElement('div');
                    meta.className = 'barcode-meta';
                    meta.style.marginTop = '12px';
                    if (showIndex) {
                        const idx = document.createElement('span');
                        idx.className = 'barcode-index';
                        idx.style.background = 'linear-gradient(135deg, #11998e 0%, #38ef7d 100%)';
                        idx.textContent = '#' + (index + 1);
                        meta.appendChild(idx);
                    }
                    const txt = document.createElement('span');
                    txt.className = 'barcode-text';
                    txt.style.fontSize = Math.max(12, size / 18) + 'px';
                    txt.style.maxWidth = size + 'px';
                    txt.textContent = text.length > 60 ? text.substring(0, 60) + '...' : text;
                    txt.title = text;
                    meta.appendChild(txt);
                    itemDiv.appendChild(meta);

                    listDiv.appendChild(itemDiv);

                    try {
                        const dataUrl = await new Promise((resolve, reject) => {
                            QRCode.toDataURL(text, {
                                width: size * 2,    // 2倍密度高清
                                margin: 2,
                                errorCorrectionLevel: ecLevel,
                                color: { dark: '#000000', light: '#ffffff' }
                            }, (err, url) => err ? reject(err) : resolve(url));
                        });
                        img.src = dataUrl;
                        generatedItems.push({ id: index, text: text, element: itemDiv, img: img, dataUrl: dataUrl });
                        successCount++;
                    } catch (err) {
                        console.error('QRCode error:', err);
                        itemDiv.innerHTML = `<div class="text-red-500 py-4">❌ 无法生成: ${text.substring(0,30)}<br><small style="color:#999">${err.message || err}</small></div>`;
                    }
                }
                showToast(`成功生成 ${successCount} 个二维码`);
            })();
        }

        /* ====== 清空 ====== */
        function clearAll(type) {
            document.getElementById(type + '-list').innerHTML = '';
            document.getElementById(type + '-input').value = '';
            generatedItems = [];
            stopScroll(); stopSlideshow();
            showToast('已清空');

        /* ====== 下载全部 (ZIP) ====== */
        async function downloadAll(type) {
            if (!generatedItems.length) { showToast('请先生成条码'); return; }
            showToast('正在打包下载...');
            const zip = new JSZip();
            const folder = zip.folder(type + '_' + Date.now());

            for (const item of generatedItems) {
                let dataUrl;
                if (type === 'barcode') {
                    const svg = document.getElementById('barcode-svg-' + item.id);
                    const svgData = new XMLSerializer().serializeToString(svg);
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const img = new Image();
                    const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                    const url = URL.createObjectURL(svgBlob);
                    await new Promise(resolve => {
                        img.onload = function() {
                            canvas.width = img.width * 2;
                            canvas.height = img.height * 2;
                            ctx.scale(2,2); ctx.fillStyle='white';
                            ctx.fillRect(0,0,canvas.width,canvas.height);
                            ctx.drawImage(img,0,0);
                            dataUrl = canvas.toDataURL('image/png');
                            URL.revokeObjectURL(url); resolve();
                        };
                        img.src = url;
                    });
                } else {
                    dataUrl = generatedItems.find(g => g.id === item.id).dataUrl;
                }
                const base64 = dataUrl.split(',')[1];
                const name = item.text.replace(/[^a-zA-Z0-9\u4e00-\u9fa5]/g, '_').substring(0,50);
                folder.file(`${String(item.id+1).padStart(3,'0')}_${name}.png`, base64, { base64: true });
            }
            const content = await zip.generateAsync({ type: 'blob' });
            saveAs(content, `${type}批量_${generatedItems.length}个_${new Date().toLocaleDateString()}.zip`);
            showToast('下载完成！');
        }

        /* ====== 自动滚动 ====== */
        function toggleScroll() {
            if (!generatedItems.length) { showToast('请先生成条码'); return; }
            if (isScrolling) { stopScroll(); } else { startScroll(); }
        }
        function startScroll() {
            isScrolling = true;
            document.getElementById('scroll-btn').classList.add('active');
            document.getElementById('scroll-btn').textContent = '⏸';
            stopSlideshow();
            scrollY = window.scrollY;
            let lastTime = performance.now();
            function step(now) {
                const dt = (now - lastTime) / 1000; // 秒
                lastTime = now;
                const v = parseInt(document.getElementById('scroll-speed').value);
                const pxps = 60 + (v - 1) * 14.55; // 线性: v=1→60px/s, v=100→1500px/s
                scrollY += pxps * dt;
                const max = document.documentElement.scrollHeight - window.innerHeight;
                if (scrollY >= max) scrollY = 0;
                window.scrollTo(0, scrollY);
                scrollAnimationId = requestAnimationFrame(step);
            }
            scrollAnimationId = requestAnimationFrame(step);
        }
        function stopScroll() {
            isScrolling = false;
            if (scrollAnimationId) { cancelAnimationFrame(scrollAnimationId); scrollAnimationId = null; }
            document.getElementById('scroll-btn').classList.remove('active');
            document.getElementById('scroll-btn').textContent = '⇅';
        }

        /* ====== 幻灯播放 ====== */
        function toggleSlideshow() {
            if (!generatedItems.length) { showToast('请先生成条码'); return; }
            if (isPlaying) { stopSlideshow(); } else { startSlideshow(); }
        }
        function startSlideshow() {
            isPlaying = true; currentSlideIndex = 0;
            document.getElementById('play-btn').classList.add('active');
            document.getElementById('play-btn').textContent = '⏸';
            stopScroll();
            document.getElementById('slideshow-overlay').classList.add('active');
            showSlide(currentSlideIndex);
            const interval = getPlayInterval();
            playIntervalId = setInterval(() => {
                currentSlideIndex = (currentSlideIndex + 1) % generatedItems.length;
                showSlide(currentSlideIndex);
            }, interval);
        }
        function showSlide(index) {
            const item = generatedItems[index];
            const slideItem = document.getElementById('slideshow-item');
            document.querySelectorAll('.barcode-item').forEach(el => el.classList.remove('highlight'));
            item.element.classList.add('highlight');
            item.element.scrollIntoView({ behavior: 'smooth', block: 'center' });
            slideItem.innerHTML = '';
            if (currentType === 'barcode') {
                const svg = document.getElementById('barcode-svg-' + item.id);
                const clone = svg.cloneNode(true);
                clone.setAttribute('width', Math.min(500, window.innerWidth * 0.7));
                clone.style.maxWidth = '100%';
                slideItem.appendChild(clone);
                const t = document.createElement('div');
                t.className = 'mt-4 text-2xl font-mono text-center break-all max-w-2xl';
                t.textContent = item.text;
                slideItem.appendChild(t);
            } else {
                const srcImg = document.getElementById('qrcode-img-' + item.id);
                const img = document.createElement('img');
                const sz = Math.min(500, window.innerWidth * 0.7);
                img.src = srcImg.src;
                img.style.width = sz + 'px';
                img.style.height = sz + 'px';
                img.style.imageRendering = 'pixelated';
                slideItem.appendChild(img);
                const t = document.createElement('div');
                t.className = 'mt-4 text-xl text-center break-all max-w-md';
                t.textContent = item.text;
                slideItem.appendChild(t);
            }
            document.getElementById('slideshow-counter').textContent = `${index+1} / ${generatedItems.length}`;
        }
        function stopSlideshow() {
            isPlaying = false;
            if (playIntervalId) { clearInterval(playIntervalId); playIntervalId = null; }
            document.getElementById('play-btn').classList.remove('active');
            document.getElementById('play-btn').textContent = '▶';
            document.getElementById('slideshow-overlay').classList.remove('active');
            document.querySelectorAll('.barcode-item').forEach(el => el.classList.remove('highlight'));
        }

        /* ====== 键盘快捷键 ====== */
        document.addEventListener('keydown', function(e) {
            // 避免在输入框中触发
            if (['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName) && !e.target.closest('#print-modal')) {
                if (e.key === 'Escape') { stopScroll(); stopSlideshow(); }
                return;
            }
            if (e.key === 'Escape') {
                stopScroll(); stopSlideshow(); closePrintModal();
            }
            if (isPlaying) {
                if (e.key === 'ArrowRight' || e.key === ' ') {
                    e.preventDefault();
                    currentSlideIndex = (currentSlideIndex + 1) % generatedItems.length;
                    showSlide(currentSlideIndex);
                } else if (e.key === 'ArrowLeft') {
                    currentSlideIndex = (currentSlideIndex - 1 + generatedItems.length) % generatedItems.length;
                    showSlide(currentSlideIndex);
                }
            } else if (e.key === ' ' && generatedItems.length && !document.getElementById('print-modal').classList.contains('active')) {
                e.preventDefault(); toggleScroll();
            }
        });

        /* =========================================================
         *  打印功能
         * ========================================================= */
        function openPrintModal() {
            if (!generatedItems.length) { showToast('请先生成条码'); return; }
            document.getElementById('print-modal').classList.add('active');
        }
        function closePrintModal() {

        function onPaperChange() {
            const v = document.getElementById('p-paper').value;
            const wInput = document.getElementById('p-width');
            const hInput = document.getElementById('p-height');
            if (PAPER_SIZES[v]) {

                hInput.value = PAPER_SIZES[v][1];

            }

        function applyOrientation() {
            // 切换纵向/横向时自动交换宽高（仅当非自定义时友好处理）
            // 不强制交换，让用户决定；这里留空
        }
        document.getElementById('p-orientation').addEventListener('change', function() {
            const w = document.getElementById('p-width').value;
            const h = document.getElementById('p-height').value;
            // 用户主动切换方向时，交换宽高

            document.getElementById('p-height').value = w;
        });

        function getPrintSettings() {
            return {
                layout: document.getElementById('p-layout').value,   // h 横向先行 / v 纵向先列
                cols: parseInt(document.getElementById('p-cols').value) || 4,
                rows: parseInt(document.getElementById('p-rows').value) || 0,
                ml: parseInt(document.getElementById('p-margin-l').value) || 0,
                mr: parseInt(document.getElementById('p-margin-r').value) || 0,
                mt: parseInt(document.getElementById('p-margin-t').value) || 0,
                mb: parseInt(document.getElementById('p-margin-b').value) || 0,
                gx: parseInt(document.getElementById('p-gap-x').value) || 0,
                gy: parseInt(document.getElementById('p-gap-y').value) || 0,
                orientation: document.getElementById('p-orientation').value,
                paperW: parseFloat(document.getElementById('p-width').value) || 210,
                paperH: parseFloat(document.getElementById('p-height').value) || 297,
                scale: (parseFloat(document.getElementById('p-scale').value) || 100) / 100,
                pageNum: document.getElementById('p-pagenum').checked
            };
        }

        // 将条码元素转换为 dataURL
        async function itemToDataURL(item, cellW_px, cellH_px, scale) {
            // cellW/H 是 CSS px；按设备像素比生成图
            const dpr = 2;
            const targetW = cellW_px * scale;
            const targetH = cellH_px * scale;
            const canvas = document.createElement('canvas');
            canvas.width = targetW * dpr;
            canvas.height = targetH * dpr;
            const ctx = canvas.getContext('2d');
            ctx.scale(dpr, dpr);
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, targetW, targetH);

            if (currentType === 'barcode') {
                const svg = document.getElementById('barcode-svg-' + item.id);
                const svgData = new XMLSerializer().serializeToString(svg);
                const img = new Image();
                const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                await new Promise((resolve, reject) => {
                    img.onload = () => {
                        // 等比缩放填入，保留一点内边距
                        const pad = 8 * scale;
                        const availW = targetW - pad*2;
                        const availH = targetH - pad*2 - 16*scale; // 留出文本位置
                        const ratio = Math.min(availW / img.naturalWidth, availH / img.naturalHeight, 1);
                        const drawW = img.naturalWidth * ratio;
                        const drawH = img.naturalHeight * ratio;
                        const x = (targetW - drawW) / 2;
                        const y = pad;
                        ctx.drawImage(img, x, y, drawW, drawH);
                        // 文字
                        ctx.fillStyle = '#111';
                        ctx.font = `${12*scale}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText(item.text, targetW/2, drawH + pad + 12*scale);
                        URL.revokeObjectURL(url);
                        resolve();
                    };
                    img.onerror = reject;
                    img.src = url;
                });
            } else {
                const qrImg = document.getElementById('qrcode-img-' + item.id);
                await new Promise((resolve, reject) => {
                    const tmpImg = new Image();
                    tmpImg.crossOrigin = 'anonymous';
                    tmpImg.onload = () => {
                        const pad = 6 * scale;
                        const avail = Math.min(targetW, targetH) - pad*2 - 18*scale;
                        const sz = Math.min(avail, tmpImg.naturalWidth, tmpImg.naturalHeight);
                        const x = (targetW - sz) / 2;
                        const y = pad;
                        ctx.drawImage(tmpImg, x, y, sz, sz);
                        ctx.fillStyle = '#333';
                        ctx.font = `${10*scale}px sans-serif`;
                        ctx.textAlign = 'center';
                        const txt = item.text.length > 40 ? item.text.substring(0,38)+'…' : item.text;
                        ctx.fillText(txt, targetW/2, y + sz + 12*scale);
                        resolve();
                    };
                    tmpImg.onerror = reject;
                    tmpImg.src = qrImg.src;
                });
            }
            return canvas.toDataURL('image/png');
        }

        // mm -> px (按 96dpi, 1mm ≈ 3.7795px)
        const MM = 3.7795275591;

        function arrangeItems(items, cols, rows, mode) {
            // 按先行后列/先列后行排列为二维数组
            const result = [];
            if (mode === 'v') {
                // 纵向先列后行：按列填充
                // 需要知道每页行数
                const total = items.length;
                const perPage = cols * rows;
                let idx = 0;
                while (idx < total) {
                    const page = [];
                    for (let r = 0; r < rows; r++) page.push(new Array(cols).fill(null));
                    for (let c = 0; c < cols; c++) {
                        for (let r = 0; r < rows; r++) {
                            if (idx < total && (idx % perPage) < perPage) {
                                page[r][c] = items[idx];
                                idx++;
                            }
                        }
                    }
                    result.push(page);
                }
            } else {
                // 横向先行后列
                const total = items.length;
                let idx = 0;
                while (idx < total) {
                    const page = [];
                    for (let r = 0; r < rows; r++) {
                        const row = [];
                        for (let c = 0; c < cols; c++) {
                            row.push(idx < total ? items[idx] : null);
                            idx++;
                        }
                        page.push(row);
                    }
                    result.push(page);
                }
            }
            return result;
        }

        async function buildPrintPages() {
            const s = getPrintSettings();
            const area = document.getElementById('print-area');
            area.innerHTML = '';

            // 计算单元格尺寸
            const contentW_mm = s.paperW - s.ml - s.mr;
            const contentH_mm = s.paperH - s.mt - s.mb - (s.pageNum ? 8 : 0);
            const cellW_mm = (contentW_mm - s.gx * (s.cols - 1)) / s.cols;
            // 计算行数：若为0则自动
            let rows = s.rows;
            if (rows <= 0) {
                rows = Math.max(1, Math.floor((contentH_mm + s.gy) / (cellW_mm * (currentType === 'qrcode' ? 1 : 0.6) + s.gy)));
                if (currentType === 'barcode') {
                    // 条码较扁，估算单元格高度按宽:高 ≈ 3:2
                    rows = Math.max(1, Math.floor((contentH_mm + s.gy) / (cellW_mm * 0.55 + s.gy)));
                } else {
                    rows = Math.max(1, Math.floor((contentH_mm + s.gy) / (cellW_mm + s.gy)));
                }
            }
            const cellH_mm = (contentH_mm - s.gy * (rows - 1)) / rows;

            // 纸张像素尺寸
            const pageW_px = s.paperW * MM * s.scale;
            const pageH_px = s.paperH * MM * s.scale;
            const cellW_px = cellW_mm * MM * s.scale;
            const cellH_px = cellH_mm * MM * s.scale;
            const ml_px = s.ml * MM * s.scale;
            const mt_px = s.mt * MM * s.scale;
            const gx_px = s.gx * MM * s.scale;
            const gy_px = s.gy * MM * s.scale;

            // 分页
            const pages = arrangeItems(generatedItems, s.cols, rows, s.layout);

            for (let pi = 0; pi < pages.length; pi++) {
                const pageDiv = document.createElement('div');
                pageDiv.className = 'print-page';
                pageDiv.style.width = pageW_px + 'px';
                pageDiv.style.height = pageH_px + 'px';
                pageDiv.style.padding = `${mt_px}px ${s.mr*MM*s.scale}px ${s.mb*MM*s.scale}px ${ml_px}px`;
                pageDiv.style.position = 'relative';

                const grid = document.createElement('div');
                grid.className = 'print-grid';
                grid.style.width = '100%';
                grid.style.height = (s.pageNum ? (pageH_px - mt_px - s.mb*MM*s.scale - 14*s.scale) : (pageH_px - mt_px - s.mb*MM*s.scale)) + 'px';
                grid.style.gridTemplateColumns = `repeat(${s.cols}, 1fr)`;
                grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
                grid.style.gap = `${gy_px}px ${gx_px}px`;

                const page = pages[pi];
                for (let r = 0; r < rows; r++) {
                    for (let c = 0; c < s.cols; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'print-cell';
                        const item = page[r] && page[r][c];
                        if (item) {
                            const img = document.createElement('img');
                            img.style.maxWidth = '100%';
                            img.style.maxHeight = '100%';
                            const url = await itemToDataURL(item, cellW_px, cellH_px, s.scale);
                            img.src = url;
                            cell.appendChild(img);
                        }
                        grid.appendChild(cell);
                    }
                }
                pageDiv.appendChild(grid);

                if (s.pageNum) {
                    const pn = document.createElement('div');
                    pn.className = 'print-page-num';
                    pn.style.height = (14*s.scale) + 'px';
                    pn.textContent = `第 ${pi+1} / ${pages.length} 页`;
                    pageDiv.appendChild(pn);
                }
                area.appendChild(pageDiv);
            }

            // 写入 @page 尺寸
            let styleEl = document.getElementById('print-page-style');
            if (!styleEl) {
                styleEl = document.createElement('style');
                styleEl.id = 'print-page-style';
                document.head.appendChild(styleEl);
            }
            const sizeW = s.paperW + 'mm';
            const sizeH = s.paperH + 'mm';
            styleEl.textContent = `@media print {
                @page { size: ${sizeW} ${sizeH} ${s.orientation}; margin: 0; }
            }`;

            area.style.display = 'block';
            return { pages: pages.length, cellW_mm, cellH_mm, rows };
        }

        async function previewPrint() {
            const info = await buildPrintPages();
            showToast(`已生成 ${info.pages} 页预览 (${info.cellW_mm.toFixed(1)}×${info.cellH_mm.toFixed(1)}mm/格, ${document.getElementById('p-cols').value}列×${info.rows}行)`);
            // 滚动到打印预览区域
            document.getElementById('print-area').scrollIntoView({ behavior: 'smooth' });
        }

        async function doPrint() {
            await buildPrintPages();
            // 给图片渲染一点点时间
            setTimeout(() => {
                window.print();
            }, 200);
        }

        // 打印后清理
        window.onafterprint = function() {
            document.getElementById('print-area').style.display = 'none';
        };
    </script>
</body>
</html>
